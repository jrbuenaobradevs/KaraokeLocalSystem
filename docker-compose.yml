version: '3.8'

services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
      - ./media:/app/media
      - ./backups:/app/backups
    ports:
      - 8000:8000
    environment:
      - DATABASE_URL=sqlite:///./karaoke.db
      - MEDIA_PATH=./media
      - PIN_CODE=1234

  dashboard:
    build: ./frontend/server-dashboard
    command: npm run dev -- --host 0.0.0.0 --port 3000
    working_dir: /app
    volumes:
      - ./frontend/server-dashboard:/app
    ports:
      - 3000:3000
